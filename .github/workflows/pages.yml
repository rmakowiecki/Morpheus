name: Pages

# Deploys the wasm samples gallery as the live demo at https://rmakowiecki.github.io/Morpheus/.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys run one after the other, so the last push wins; an in-progress deploy is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the gallery's browser distribution
        run: ./gradlew :samples:gallery:wasmJsBrowserDistribution --stacktrace
      - uses: actions/upload-pages-artifact@v3
        with:
          path: samples/gallery/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
