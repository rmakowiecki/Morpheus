name: Release

# Tags and releases a merge of develop into main. The version is VERSION_NAME in gradle.properties. The notes are
# the ones GitHub generates; a release written by hand replaces its body afterwards.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if [ -z "$version" ]; then
            echo "VERSION_NAME is missing from gradle.properties" >&2
            exit 1
          fi
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "main must not carry a snapshot: VERSION_NAME is $version" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is already released; raise VERSION_NAME before merging into main" >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
