# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# The gallery's production wasm link runs out of the default heap (GC overhead limit exceeded).
kotlin.daemon.jvmargs=-Xmx4g
# Retry/backoff on transient repo errors (e.g. HTTP 429 from Maven Central / Gradle Plugin Portal on cold CI builds)
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
