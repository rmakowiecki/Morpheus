# Project-wide Gradle settings.

# Every library module's version. `develop` carries the next version with a -SNAPSHOT suffix. Releasing sets it to
# the plain version, and merging develop into main tags that commit v<VERSION_NAME> (.github/workflows/release.yml).
VERSION_NAME=0.1.0

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# The gallery's production wasm link runs out of the default heap (GC overhead limit exceeded).
kotlin.daemon.jvmargs=-Xmx4g
# Retry/backoff on transient repo errors (e.g. HTTP 429 from Maven Central / Gradle Plugin Portal on cold CI builds)
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
